<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arisesai Games</title>
<style>
  :root { --bg: #fbf7fc; --fg: #2a2140; --muted: #6a5f80; --accent: #d6407a; --card: #ffffff; --line: #eadff0; }
  @media (prefers-color-scheme: dark) { :root { --bg: #17132b; --fg: #f3ecf8; --muted: #b5a8c8; --accent: #ff7fa8; --card: #221c3d; --line: #2e2650; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 680px; margin: 0 auto; padding: 40px 18px 56px; }
  h1 { font-size: 32px; margin: 0 0 4px; }
  .muted { color: var(--muted); }
  .game { display: flex; gap: 16px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; margin-top: 28px; }
  .game img { width: 84px; height: 84px; border-radius: 20px; flex: none; }
  .game h2 { margin: 0 0 2px; font-size: 20px; }
  .game p { margin: 0 0 6px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Arisesai Games</h1>
  <p class="muted">Small, cute arcade games for Android.</p>

  <div class="game">
    <img src="icon.png" alt="Balloon Archer app icon">
    <div>
      <h2>Balloon Archer</h2>
      <p>Help the baby archer pop the balloons in number order with heart arrows.</p>
      <a href="privacy.html">Privacy policy</a>
    </div>
  </div>

  <div class="game">
    <img src="eggscape-icon.png" alt="Eggscape app icon">
    <div>
      <h2>Eggscape</h2>
      <p>Fling a cute egg up from nest to nest, bounce off clouds and dodge the spikes.</p>
      <a href="eggscape-privacy.html">Privacy policy</a>
    </div>
  </div>

  <p class="muted" style="margin-top:32px">Contact: arisesai007@gmail.com</p>
</main>
</body>
</html>
